name: CI Pipeline - Build & Push Docker Image

on:
  push:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout app code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ankacy/gitops-app:${{ github.sha }} .

    - name: Push Docker image
      run: docker push ankacy/gitops-app:${{ github.sha }}

    - name: Checkout infra repository
      uses: actions/checkout@v4
      with:
        repository: anka-cy/Gitops-project-infra
        token: ${{ secrets.INFRA_REPO_TOKEN }}
        path: infra

    - name: Update deployment.yaml with new image tag
      run: |
        sed -i "s|ankacy/gitops-app:[^ ]*|ankacy/gitops-app:${{ github.sha }}|g" infra/k8s/deployment.yaml

    - name: Commit and push updated deployment.yaml to infra repo
      run: |
        cd infra
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/deployment.yaml
        git commit -m "ci: update image tag to ${{ github.sha }}"
        git push