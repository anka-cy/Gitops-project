name: CI Pipeline - Build & Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Docker image
      run: docker build -t ankacy/gitops-app:${{ github.sha }} .

    - name: Push Docker image
      run: docker push ankacy/gitops-app:${{ github.sha }}

    - name: Update deployment.yaml with new image tag
      run: |
        sed -i "s|ankacy/gitops-app:IMAGE_TAG|ankacy/gitops-app:${{ github.sha }}|g" k8s/deployment.yaml

    - name: Commit and push updated deployment.yaml
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/deployment.yaml
        git commit -m "ci: update image tag to ${{ github.sha }}"
        git push