<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .dot {
            height: 12px;
            width: 12px;
            background-color: #22c55e;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #1e293b;
        }

        p {
            font-size: 16px;
            color: #64748b;
            line-height: 1.5;
        }

        .tag {
            background-color: #eff6ff;
            color: #3b82f6;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tag">Two-Repo GitOps Architecture</div>
        
        <div class="status-header">
            <span class="dot"></span>
            <h1>Server is Up & Running</h1>
        </div>
        
        <p>This application was deployed automatically via GitHub Actions and ArgoCD.</p>
    </div>
</body>
</html>
